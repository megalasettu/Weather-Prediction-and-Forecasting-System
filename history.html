<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Search History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        /* ==============================
           BACKGROUND
        ============================== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;

            background-image:
                linear-gradient(
                    rgba(0, 40, 80, 0.35),
                    rgba(0, 40, 80, 0.35)
                ),
                url("weather-bg.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            max-width: 1200px;
            margin: auto;
        }


        /* ==============================
           PAGE TITLE
        ============================== */

        h1 {
            text-align: center;
            color: white;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 8px;

            text-shadow:
                0 3px 8px
                rgba(0, 0, 0, 0.25);
        }


        /* ==============================
           SUBTITLE
        ============================== */

        .subtitle {
            text-align: center;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
        }


        /* ==============================
           TOP BUTTON AREA
        ============================== */

        .top-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }


        /* ==============================
           CLEAR ALL BUTTON
        ============================== */

      .clear-btn {
    border: none;
    padding: 11px 18px;

    background: #6ec6ff;
    color: white;

    border-radius: 9px;

    font-weight: bold;
    font-size: 14px;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(0, 0, 0, 0.15);

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.clear-btn:hover {
    background: #006edc;
    transform: translateY(-2px);
}


        /* ==============================
           MESSAGE
        ============================== */

        #message {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-bottom: 22px;
        }


        /* ==============================
           HISTORY GRID
           5 CARDS PER ROW
        ============================== */

        .history-container {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 16px;

            width: 100%;
        }


        /* ==============================
           HISTORY CARD
        ============================== */

        .history-card {

            background:
                rgba(255, 255, 255, 0.95);

            padding: 16px;

            border-radius: 16px;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.16);

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* ==============================
           CARD HOVER
        ============================== */

        .history-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.22);
        }


        /* ==============================
           LOCATION
        ============================== */

        .history-card h2 {

            color: #0b315c;

            font-size: 17px;

            margin-top: 0;
            margin-bottom: 13px;

            padding-bottom: 10px;

            border-bottom:
                2px solid #e5f3ff;
        }


        /* ==============================
           WEATHER DETAILS
        ============================== */

        .history-card p {

            margin: 7px 0;

            padding: 8px 9px;

            background:
                #f4faff;

            border-radius: 8px;

            color: #374151;

            font-size: 13px;

            line-height: 1.4;
        }


        .history-card b {
            color: #0b315c;
        }


        /* ==============================
           DELETE BUTTON
        ============================== */

       .delete-btn {
    width: 100%;

    margin-top: 10px;

    padding: 9px;

    border: none;

    background: #6ec6ff;

    color: white;

    border-radius: 8px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.delete-btn:hover {
    background: #006edc;

    transform: translateY(-2px);
}

        /* ==============================
           BACK BUTTON
        ============================== */

        .back-btn {

            display: block;

            width: 200px;

            margin: 30px auto 10px;

            padding: 13px;

            text-align: center;

            background:
                #6ec6ff;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

            font-size: 15px;

            box-shadow:
                0 6px 15px
                rgba(0, 0, 0, 0.15);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .back-btn:hover {

            background:
                #006edc;

            transform:
                translateY(-2px);
        }


        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 1000px) {

            .history-container {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 650px) {

            body {
                padding: 25px 15px;
            }


            h1 {
                font-size: 27px;
            }


            .history-container {

                grid-template-columns:
                    1fr;
            }


            .history-card {
                padding: 18px;
            }


            .top-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- ==============================
             TITLE
        ============================== -->

        <h1>
            🌦️ Weather Search History
        </h1>


        <div class="subtitle">
            View your previous weather searches
        </div>


        <!-- ==============================
             TOP ACTION
        ============================== -->

        <div class="top-actions">

            <button
                class="clear-btn"
                id="clearAllBtn"
                onclick="clearAllHistory()">

                🗑️ Clear All History

            </button>

        </div>


        <!-- ==============================
             MESSAGE
        ============================== -->

        <div id="message">
            Loading search history...
        </div>


        <!-- ==============================
             HISTORY CONTAINER
        ============================== -->

        <div
            class="history-container"
            id="historyContainer">

        </div>


        <!-- ==============================
             BACK BUTTON
        ============================== -->

        <a
            href="index.html"
            class="back-btn">

            ← Back to Weather

        </a>

    </div>



    <script>

        // ==========================================
        // LOAD USER SEARCH HISTORY
        // ==========================================

        async function loadHistory() {

            const historyContainer =
                document.getElementById(
                    "historyContainer"
                );

            const message =
                document.getElementById(
                    "message"
                );

            const clearAllBtn =
                document.getElementById(
                    "clearAllBtn"
                );


            // Clear old cards before loading

            historyContainer.innerHTML = "";


            // ==========================================
            // GET LOGIN TOKEN
            // ==========================================

            const token =
                localStorage.getItem("token");


            // ==========================================
            // CHECK LOGIN
            // ==========================================

            if (!token) {

                message.textContent =
                    "Please login to view your search history.";

                clearAllBtn.style.display =
                    "none";

                return;
            }


            try {

                // ==========================================
                // GET HISTORY FROM SERVER
                // ==========================================

                const response =
                    await fetch(
                        "https://weather-prediction-and-forecasting-system.onrender.com/api/history",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                // ==========================================
                // LOGIN / TOKEN ERROR
                // ==========================================

                if (response.status === 401) {

                    message.textContent =
                        "Session expired. Please login again.";

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    clearAllBtn.style.display =
                        "none";

                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to fetch history"
                    );
                }


                const history =
                    await response.json();


                // ==========================================
                // NO HISTORY
                // ==========================================

                if (history.length === 0) {

                    message.textContent =
                        "No weather search history found.";

                    clearAllBtn.style.display =
                        "none";

                    return;
                }


                // ==========================================
                // HISTORY AVAILABLE
                // ==========================================

                message.textContent = "";

                clearAllBtn.style.display =
                    "block";


                // ==========================================
                // DISPLAY HISTORY
                // ==========================================

                history.forEach(function (item) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "history-card";


                    const date =
                        new Date(
                            item.searchedAt
                        ).toLocaleString();


                    card.innerHTML = `

                        <h2>
                            📍 ${item.location},
                            ${item.country}
                        </h2>


                        <p>
                            🌡️ <b>Temperature:</b>
                            ${item.temperature} °C
                        </p>


                        <p>
                            ☁️ <b>Condition:</b>
                            ${item.condition}
                        </p>


                        <p>
                            💧 <b>Humidity:</b>
                            ${item.humidity}%
                        </p>


                        <p>
                            💨 <b>Wind Speed:</b>
                            ${item.windSpeed} km/h
                        </p>


                        <p>
                            🕒 <b>Searched At:</b>
                            ${date}
                        </p>


                        <button
                            class="delete-btn"
                            onclick="deleteHistory('${item._id}')">

                            🗑️ Delete

                        </button>

                    `;


                    historyContainer.appendChild(
                        card
                    );

                });


            } catch (error) {

                console.error(
                    "History error:",
                    error
                );


                message.textContent =
                    "Unable to load search history.";

                clearAllBtn.style.display =
                    "none";
            }
        }



        // ==========================================
        // DELETE ONE HISTORY
        // ==========================================

        async function deleteHistory(id) {

            const token =
                localStorage.getItem("token");


            // ==========================================
            // CHECK LOGIN
            // ==========================================

            if (!token) {

                window.location.href =
                    "login.html";

                return;
            }


            // ==========================================
            // CONFIRM DELETE
            // ==========================================

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this history?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                // ==========================================
                // DELETE REQUEST
                // ==========================================

                const response =
                    await fetch(
                        `http://localhost:3000/api/history/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // ==========================================
                // ERROR
                // ==========================================

                if (!response.ok) {

                    alert(
                        data.error ||
                        "Unable to delete history."
                    );

                    return;
                }


                // ==========================================
                // SUCCESS
                // ==========================================

                alert(
                    "History deleted successfully!"
                );


                // Reload history

                loadHistory();


            } catch (error) {

                console.error(
                    "Delete history error:",
                    error
                );


                alert(
                    "Unable to delete history."
                );
            }
        }



        // ==========================================
        // CLEAR ALL HISTORY
        // ==========================================

        async function clearAllHistory() {

            const token =
                localStorage.getItem("token");


            // ==========================================
            // CHECK LOGIN
            // ==========================================

            if (!token) {

                window.location.href =
                    "login.html";

                return;
            }


            // ==========================================
            // CONFIRM CLEAR ALL
            // ==========================================

            const confirmClear =
                confirm(
                    "Are you sure you want to clear ALL your search history?"
                );


            if (!confirmClear) {
                return;
            }


            try {

                // ==========================================
                // DELETE ALL REQUEST
                // ==========================================

                const response =
                    await fetch(
                        "http://localhost:3000/api/history",
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // ==========================================
                // ERROR
                // ==========================================

                if (!response.ok) {

                    alert(
                        data.error ||
                        "Unable to clear history."
                    );

                    return;
                }


                // ==========================================
                // SUCCESS
                // ==========================================

                alert(
                    "All search history cleared successfully!"
                );


                // Reload history

                loadHistory();


            } catch (error) {

                console.error(
                    "Clear history error:",
                    error
                );


                alert(
                    "Unable to clear history."
                );
            }
        }



        // ==========================================
        // START
        // ==========================================

        loadHistory();

    </script>

</body>

</html>
