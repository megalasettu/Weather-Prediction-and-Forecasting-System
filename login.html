<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Weather Prediction and Forecasting System</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* ==========================================
           BODY / WEATHER BACKGROUND
        ========================================== */

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(20, 60, 100, 0.18),
                    rgba(20, 60, 100, 0.18)
                ),
                url("weather-bg.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ==========================================
           LOGIN CARD
        ========================================== */

        .login-container {

            width: 430px;

            padding: 40px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.85);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            text-align: center;
        }


        /* ==========================================
           WEATHER ICON
        ========================================== */

        .weather-icon {

            width: 170px;

            height: 125px;

            margin: 0 auto 5px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;
        }


        .realistic-weather-icon {

            width: 150px;

            height: 115px;

            position: relative;
        }


        /* ==========================================
           SUN
        ========================================== */

        .sun {

            position: absolute;

            width: 62px;

            height: 62px;

            top: 5px;

            right: 18px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #fffbd0 0%,
                    #fff176 25%,
                    #ffd43b 55%,
                    #ffb300 82%,
                    #f28c00 100%
                );

            box-shadow:
                0 0 8px rgba(255, 210, 50, 0.8),
                0 0 22px rgba(255, 190, 30, 0.55),
                0 0 40px rgba(255, 190, 30, 0.25);

            z-index: 1;
        }


        /* ==========================================
           SUN GLOW
        ========================================== */

        .sun::before {

            content: "";

            position: absolute;

            width: 82px;

            height: 82px;

            left: -10px;

            top: -10px;

            border-radius: 50%;

            background:
                rgba(255, 220, 80, 0.15);

            filter: blur(8px);

            z-index: -1;
        }


        /* ==========================================
           MAIN CLOUD
        ========================================== */

        .cloud-one {

            position: absolute;

            width: 112px;

            height: 45px;

            left: 8px;

            bottom: 17px;

            border-radius: 50px;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #fdfefe 25%,
                    #eef3f8 60%,
                    #cbd7e2 100%
                );

            box-shadow:
                0 7px 10px rgba(30, 55, 80, 0.18),
                inset 0 3px 5px rgba(255, 255, 255, 0.9),
                inset 0 -5px 8px rgba(150, 170, 190, 0.18);

            z-index: 3;
        }


        /* ==========================================
           BIG CLOUD BUMP
        ========================================== */

        .cloud-one::before {

            content: "";

            position: absolute;

            width: 68px;

            height: 68px;

            left: 16px;

            top: -38px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #ffffff 0%,
                    #ffffff 28%,
                    #f7fafc 52%,
                    #e2e9f0 78%,
                    #cbd6df 100%
                );

            box-shadow:
                inset -6px -5px 10px
                rgba(130, 150, 170, 0.16),

                0 6px 10px
                rgba(50, 70, 90, 0.12);
        }


        /* ==========================================
           SMALL CLOUD BUMP
        ========================================== */

        .cloud-one::after {

            content: "";

            position: absolute;

            width: 55px;

            height: 55px;

            right: 14px;

            top: -29px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff 0%,
                    #ffffff 30%,
                    #f6f9fc 55%,
                    #dce5ed 82%,
                    #c7d2dc 100%
                );

            box-shadow:
                inset -5px -4px 9px
                rgba(130, 150, 170, 0.14),

                0 5px 9px
                rgba(50, 70, 90, 0.10);
        }


        /* ==========================================
           SMALL CLOUD IN FRONT
        ========================================== */

        .cloud-two {

            position: absolute;

            width: 55px;

            height: 23px;

            right: -2px;

            bottom: 10px;

            border-radius: 30px;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #f7fafc 45%,
                    #dce5ed 100%
                );

            box-shadow:
                0 5px 9px
                rgba(40, 60, 80, 0.15),

                inset 0 2px 4px
                rgba(255, 255, 255, 0.9);

            z-index: 5;
        }


        /* ==========================================
           CLOUD HIGHLIGHT
        ========================================== */

        .cloud-two::before {

            content: "";

            position: absolute;

            width: 25px;

            height: 12px;

            left: 10px;

            top: 3px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.75);

            filter: blur(3px);
        }


        /* ==========================================
           TITLE
        ========================================== */

        .login-container h1 {

            margin: 5px 0 8px;

            color: #0b315c;

            font-size: 42px;

            font-weight: 700;
        }


        /* ==========================================
           SUBTITLE
        ========================================== */

        .subtitle {

            margin-bottom: 30px;

            color: #4d6680;

            font-size: 16px;

            line-height: 1.5;
        }


        /* ==========================================
           INPUT BOX
        ========================================== */

        .input-box {

            width: 100%;

            padding: 16px 18px;

            margin: 10px 0;

            border:
                2px solid
                rgba(100, 140, 180, 0.35);

            border-radius: 13px;

            background:
                rgba(255, 255, 255, 0.75);

            color: #102a43;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        .input-box:focus {

            border-color: #5bbcff;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(91, 188, 255, 0.15);
        }


        .input-box::placeholder {

            color: #718096;
        }


        /* ==========================================
           SHOW PASSWORD
        ========================================== */

        .show-password {

            display: flex;

            align-items: center;

            justify-content: flex-start;

            margin: 8px 0 20px;

            color: #40566d;

            font-size: 14px;
        }


        .show-password input {

            width: 16px;

            height: 16px;

            margin-right: 8px;

            cursor: pointer;
        }


        /* ==========================================
           LOGIN BUTTON - LIGHT BLUE
        ========================================== */

        .login-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #5bbcff,
                    #3498db
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(52, 152, 219, 0.25);

            transition: 0.3s;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(52, 152, 219, 0.30);
        }


        .login-btn:active {

            transform: translateY(0);
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        #message {

            margin-top: 15px;

            min-height: 20px;

            font-weight: bold;

            font-size: 15px;
        }


        /* ==========================================
           OR LINE
        ========================================== */

        .or-section {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0 20px;

            color: #718096;

            font-size: 14px;
        }


        .or-section::before,
        .or-section::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(80, 100, 120, 0.25);
        }


        /* ==========================================
           SIGN UP LINK
        ========================================== */

        .signup-link {

            color: #4d6680;

            font-size: 15px;
        }


        .signup-link a {

            color: #3498db;

            text-decoration: none;

            font-weight: bold;
        }


        .signup-link a:hover {

            text-decoration: underline;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .login-container {

                width: 100%;

                padding: 30px 22px;

                border-radius: 22px;
            }


            .login-container h1 {

                font-size: 32px;
            }


            .subtitle {

                font-size: 14px;
            }


            .weather-icon {

                width: 150px;

                height: 110px;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================
         LOGIN CONTAINER
    ========================================== -->

    <div class="login-container">


        <!-- WEATHER ICON -->

        <div class="weather-icon">

            <div class="realistic-weather-icon">

                <span class="sun"></span>

                <span class="cloud-one"></span>

                <span class="cloud-two"></span>

            </div>

        </div>


        <!-- TITLE -->

        <h1>
            Welcome Back
        </h1>


        <!-- PROJECT NAME -->

        <div class="subtitle">
            Weather Prediction and Forecasting System
        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <input
                type="email"
                id="email"
                class="input-box"
                placeholder="Enter Email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="password"
                class="input-box"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >


            <!-- SHOW PASSWORD -->

            <div class="show-password">

                <input
                    type="checkbox"
                    id="showPassword"
                >

                <label for="showPassword">
                    Show Password
                </label>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                🔐 Login

            </button>


        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- OR -->

        <div class="or-section">
            OR
        </div>


        <!-- SIGN UP -->

        <div class="signup-link">

            Don't have an account?

            <a href="backend/signup.html">
                Sign Up
            </a>

        </div>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ==========================================
           SHOW / HIDE PASSWORD
        ========================================== */

        document
            .getElementById("showPassword")
            .addEventListener(
                "change",
                function () {

                    const password =
                        document.getElementById("password");

                    if (this.checked) {

                        password.type = "text";

                    } else {

                        password.type = "password";

                    }

                }
            );


        /* ==========================================
           LOGIN
        ========================================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    message.textContent =
                        "Logging in...";


                    message.style.color =
                        "#3498db";


                    try {

                        const response =
                            await fetch(
                                "https://weather-prediction-and-forecasting-system.onrender.com/api/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        /* ==================================
                           LOGIN SUCCESS
                        ================================== */

                        if (response.ok) {


                            /* Save JWT token */

                            localStorage.setItem(
                                "token",
                                data.token
                            );


                            /* Save user details */

                            localStorage.setItem(
                                "user",
                                JSON.stringify(
                                    data.user
                                )
                            );


                            message.textContent =
                                "Login successful!";


                            message.style.color =
                                "green";


                            /* Go to Weather Home */

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "index.html";

                                },
                                1000
                            );

                        }


                        /* ==================================
                           LOGIN FAILED
                        ================================== */

                        else {

                            message.textContent =
                                data.error ||
                                "Invalid email or password";


                            message.style.color =
                                "red";
                        }

                    }


                    /* ==================================
                       SERVER ERROR
                    ================================== */

                    catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        message.textContent =
                            "Unable to connect to server";


                        message.style.color =
                            "red";
                    }

                }
            );

    </script>


</body>

</html>
