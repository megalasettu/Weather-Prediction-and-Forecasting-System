<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Weather Prediction and Forecasting System</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* ==========================================
           BODY / REALISTIC WEATHER BACKGROUND
        ========================================== */

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-image:
             linear-gradient(
              rgba(20, 60, 100, 0.18),
              rgba(20, 60, 100, 0.18)
            ),
             url("../signup-bg.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ==========================================
           SIGNUP CARD
        ========================================== */

        .auth-container {

            width: 430px;

            padding: 40px;

            border-radius: 28px;

            background:
                rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border:
                1px solid rgba(255, 255, 255, 0.85);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            text-align: center;
        }


        /* ==========================================
           REALISTIC WEATHER ICON
        ========================================== */

        .weather-icon {

            width: 170px;

            height: 125px;

            margin: 0 auto 5px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;
        }


        .realistic-weather-icon {

            width: 150px;

            height: 115px;

            position: relative;
        }


        /* ==========================================
           SUN
        ========================================== */

        .sun {

            position: absolute;

            width: 62px;

            height: 62px;

            top: 5px;

            right: 18px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #fffbd0 0%,
                    #fff176 25%,
                    #ffd43b 55%,
                    #ffb300 82%,
                    #f28c00 100%
                );

            box-shadow:

                0 0 8px
                rgba(255, 210, 50, 0.8),

                0 0 22px
                rgba(255, 190, 30, 0.55),

                0 0 40px
                rgba(255, 190, 30, 0.25);

            z-index: 1;
        }


        /* ==========================================
           SUN GLOW
        ========================================== */

        .sun::before {

            content: "";

            position: absolute;

            width: 82px;

            height: 82px;

            left: -10px;

            top: -10px;

            border-radius: 50%;

            background:
                rgba(255, 220, 80, 0.15);

            filter: blur(8px);

            z-index: -1;
        }


        /* ==========================================
           MAIN CLOUD
        ========================================== */

        .cloud-one {

            position: absolute;

            width: 112px;

            height: 45px;

            left: 8px;

            bottom: 17px;

            border-radius: 50px;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #fdfefe 25%,
                    #eef3f8 60%,
                    #cbd7e2 100%
                );

            box-shadow:

                0 7px 10px
                rgba(30, 55, 80, 0.18),

                inset 0 3px 5px
                rgba(255, 255, 255, 0.9),

                inset 0 -5px 8px
                rgba(150, 170, 190, 0.18);

            z-index: 3;
        }


        /* ==========================================
           BIG CLOUD BUMP
        ========================================== */

        .cloud-one::before {

            content: "";

            position: absolute;

            width: 68px;

            height: 68px;

            left: 16px;

            top: -38px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #ffffff 0%,
                    #ffffff 28%,
                    #f7fafc 52%,
                    #e2e9f0 78%,
                    #cbd6df 100%
                );

            box-shadow:

                inset -6px -5px 10px
                rgba(130, 150, 170, 0.16),

                0 6px 10px
                rgba(50, 70, 90, 0.12);
        }


        /* ==========================================
           SMALL CLOUD BUMP
        ========================================== */

        .cloud-one::after {

            content: "";

            position: absolute;

            width: 55px;

            height: 55px;

            right: 14px;

            top: -29px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff 0%,
                    #ffffff 30%,
                    #f6f9fc 55%,
                    #dce5ed 82%,
                    #c7d2dc 100%
                );

            box-shadow:

                inset -5px -4px 9px
                rgba(130, 150, 170, 0.14),

                0 5px 9px
                rgba(50, 70, 90, 0.10);
        }


        /* ==========================================
           SMALL CLOUD IN FRONT
        ========================================== */

        .cloud-two {

            position: absolute;

            width: 55px;

            height: 23px;

            right: -2px;

            bottom: 10px;

            border-radius: 30px;

            background:
                linear-gradient(
                    to bottom,
                    #ffffff 0%,
                    #f7fafc 45%,
                    #dce5ed 100%
                );

            box-shadow:

                0 5px 9px
                rgba(40, 60, 80, 0.15),

                inset 0 2px 4px
                rgba(255, 255, 255, 0.9);

            z-index: 5;
        }


        /* ==========================================
           CLOUD HIGHLIGHT
        ========================================== */

        .cloud-two::before {

            content: "";

            position: absolute;

            width: 25px;

            height: 12px;

            left: 10px;

            top: 3px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.75);

            filter: blur(3px);
        }


        /* ==========================================
           TITLE
        ========================================== */

        .auth-container h1 {

            margin: 5px 0 8px;

            color: #0b315c;

            font-size: 38px;

            font-weight: 700;
        }


        /* ==========================================
           SUBTITLE
        ========================================== */

        .subtitle {

            margin-bottom: 28px;

            color: #4d6680;

            font-size: 15px;

            line-height: 1.5;
        }


        /* ==========================================
           INPUT BOX
        ========================================== */

        .input-box {

            width: 100%;

            padding: 16px 18px;

            margin: 10px 0;

            border:
                2px solid
                rgba(100, 140, 180, 0.35);

            border-radius: 13px;

            background:
                rgba(255, 255, 255, 0.75);

            color: #102a43;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        .input-box:focus {

            border-color: #1683ff;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(22, 131, 255, 0.12);
        }


        .input-box::placeholder {

            color: #718096;
        }


        /* ==========================================
           SIGN UP BUTTON
        ========================================== */

        .signup-btn {

            width: 100%;

            padding: 15px;

            margin-top: 12px;

            border: none;

            border-radius: 13px;

          background: 
           linear-gradient(
             135deg,
             #5bbcff,
             #3498db
            );
            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(52, 152, 219, 0.25);

            transition: 0.3s;
        }


        .signup-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(52, 152, 219, 0.30);
        }


        .signup-btn:active {

            transform: translateY(0);
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        #message {

            min-height: 20px;

            margin-top: 15px;

            font-size: 15px;

            font-weight: bold;
        }


        /* ==========================================
           LOGIN LINK
        ========================================== */

        .login-link {

            margin-top: 22px;

            color: #4d6680;

            font-size: 15px;
        }


        .login-link a {

            color: #3498db;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }


            .auth-container {

                width: 100%;

                padding: 30px 22px;

                border-radius: 22px;
            }


            .auth-container h1 {

                font-size: 32px;
            }


            .weather-icon {

                width: 150px;

                height: 110px;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================
         SIGN UP CONTAINER
    ========================================== -->

    <div class="auth-container">


        <!-- REALISTIC WEATHER ICON -->

        <div class="weather-icon">

            <div class="realistic-weather-icon">

                <span class="sun"></span>

                <span class="cloud-one"></span>

                <span class="cloud-two"></span>

            </div>

        </div>


        <!-- TITLE -->

        <h1>
            Create Account
        </h1>


        <!-- SUBTITLE -->

        <div class="subtitle">

            Weather Prediction and Forecasting System

        </div>


        <!-- ==========================================
             NAME
        ========================================== -->

        <input
            type="text"
            id="name"
            name="name"
            class="input-box"
            placeholder="Enter Name"
            autocomplete="name"
            required
        >


        <!-- ==========================================
             EMAIL
        ========================================== -->

        <input
            type="email"
            id="email"
            name="email"
            class="input-box"
            placeholder="Enter Email"
            autocomplete="email"
            required
        >


        <!-- ==========================================
             PASSWORD
        ========================================== -->

        <input
            type="password"
            id="password"
            name="password"
            class="input-box"
            placeholder="Enter Password"
            autocomplete="new-password"
            required
        >


        <!-- ==========================================
             SIGN UP BUTTON
        ========================================== -->

        <button
            type="button"
            class="signup-btn"
            onclick="signup()">

            👤 Create Account

        </button>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- ==========================================
             LOGIN LINK
        ========================================== -->

        <div class="login-link">

            Already have an account?

            <a href="../login.html">
                Login
            </a>

        </div>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script src="auth.js"></script>


</body>

</html>
